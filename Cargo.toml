[package]
name = "embassy_test_nrf5340dk"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-futures   = { version = "0.1.2" }
embassy-sync      = { version = "0.8.0"  , features = ["defmt"] }
embassy-executor  = { version = "0.10.0" , features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time      = { version = "0.5.1"  , features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf       = { version = "0.11.0" , features = ["defmt", "nrf5340-app-s", "time-driver-rtc1", "gpiote", "unstable-pac"] }
embassy-usb       = { version = "0.6.0"  , features = ["defmt"] }
embedded-io-async = { version = "0.7.0" }

defmt             = "1.0.1"
defmt-rtt         = "1.0.0"

static_cell       = "2"
cortex-m          = { version = "0.7.6"  , features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt       = "0.7.0"
panic-probe       = { version = "1.0.0"  , features = ["print-defmt"] }
embedded-storage  = "0.3.1"
usbd-hid          = "0.10.0"
serde             = { version = "1.0.136", default-features = false }
rand              = { version = "0.9.0"  , default-features = false }

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/nrf5340" }
]
